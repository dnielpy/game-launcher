name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Type-check and compile
        run: npm run build

      - name: Package the installer
        run: npx electron-builder --win --publish never

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
