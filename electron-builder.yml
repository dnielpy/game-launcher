# The appId stays the same as earlier builds so the installer upgrades the existing install.
appId: com.dnielpy.gamelauncher
productName: Orus
directories:
  buildResources: resources
files:
  - 'out/**'
  - 'package.json'
asarUnpack:
  - 'node_modules/better-sqlite3/**'
win:
  icon: resources/icon.ico
  artifactName: 'Orus-Setup-${version}.${ext}'
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Orus
  uninstallDisplayName: Orus
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
npmRebuild: true
publish: null
