appId: com.dnielpy.gamelauncher
productName: Game Launcher
directories:
  buildResources: resources
files:
  - 'out/**'
  - 'package.json'
asarUnpack:
  - 'node_modules/better-sqlite3/**'
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: true
